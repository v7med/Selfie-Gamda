<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY STUDYY</title>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2ef;--fg:#111;--dim:#85857f;--card:#fff;--line:#d4d4cf;--red:#e5251b;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f2f2ef;--dim:#7d7d79;--card:#151515;--line:#33332f}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f2f2ef;--dim:#7d7d79;--card:#151515;--line:#33332f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:18px 14px 110px}
.logo,.big,.m,.pts{font-family:Doto,monospace;font-weight:700}
.logo{font-size:26px}.logo i{color:var(--red);font-style:normal}
.hero{margin:14px 0 18px}.big{font-size:56px;line-height:1.1;direction:ltr;text-align:start}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--fg);border-radius:9px;transition:width .5s}
.dim{color:var(--dim);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ch{border:1px solid var(--line);background:none;color:var(--fg);border-radius:99px;padding:7px 14px;font:400 13px 'IBM Plex Sans Arabic';cursor:pointer}.ch.on{background:var(--fg);color:var(--bg)}.ch.red{color:var(--red);border-color:var(--red)}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:10px 0;cursor:pointer}
.c .r1,.c .r2,.c .r3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c b{font-size:17px}.m{font-size:13px;direction:ltr;color:var(--dim)}.m.hot,.pts.low{color:var(--red)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--dim)}.tag.i2{color:var(--red);border-color:var(--red)}.tag.i1{color:var(--fg);border-color:var(--fg)}
.pts{font-size:12px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--red);color:#fff;border:0;border-radius:99px;padding:14px 26px;font:600 15px 'IBM Plex Sans Arabic';box-shadow:0 14px 30px -12px rgba(0,0,0,.5);cursor:pointer}
input,select,textarea{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:400 15px 'IBM Plex Sans Arabic',sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
label.l{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.f{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px 16px;margin:12px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{border:1px dashed var(--line);border-radius:18px;padding:12px 14px;margin:12px 0}.pl b{display:block;margin-bottom:4px}
.cr{display:flex;gap:8px;align-items:center;margin:6px 0}.cr input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--red)}.cr .nm{border:0;background:none;padding:6px 4px}.cr .nm.d{text-decoration:line-through;color:var(--dim)}
.x{border:0;background:none;color:var(--dim);font-size:20px;cursor:pointer}
.dots{display:flex;gap:4px;margin:6px 0}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.ok{background:var(--fg)}.dots i.miss{background:var(--red)}
.go{width:100%;border:0;background:var(--red);color:#fff;border-radius:16px;padding:14px;font:600 16px 'IBM Plex Sans Arabic';cursor:pointer;margin-top:6px}.go[disabled]{background:var(--line);color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:99;font-weight:600;font-size:14px;animation:drop 3.2s ease both;max-width:92%;text-align:center}
@keyframes drop{0%{opacity:0;transform:translate(-50%,-20px) scale(.9)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
#ft{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.fx{width:100%;max-width:400px;text-align:center}
.rg{position:relative;width:min(74vw,320px);aspect-ratio:1;margin:18px auto}.rg.run{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.03)}}
.rg svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Doto,monospace;font-weight:700;font-size:min(17vw,76px);direction:ltr}
.phw{min-height:80px;display:flex;align-items:center;justify-content:center}.ph{font-size:22px;font-weight:600;line-height:1.6;animation:rise 6s ease both}
@keyframes rise{0%{opacity:0;transform:translateY(30px) scale(.9);filter:blur(8px)}12%{opacity:1;transform:none;filter:none}85%{opacity:1}100%{opacity:0;transform:translateY(-24px) scale(1.04)}}
.sw{display:flex;gap:6px;margin:8px 0}.sw i{width:30px;height:30px;border-radius:9px;border:1px solid var(--line)}
.wrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:26px auto}.wh{position:absolute;inset:0;border-radius:50%;border:3px solid var(--fg)}
.wh span{position:absolute;left:50%;top:50%;width:64px;margin:-10px 0 0 -32px;text-align:center;font-size:12px;font-weight:600}
.ptr{position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:2;font-size:28px;color:var(--red)}
#wl{position:fixed;inset:0;z-index:100;background:#000 radial-gradient(#1c1c1c 1.2px,transparent 1.2px) 0 0/26px 26px;color:#f2f2ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#wl .orb{position:relative;width:190px;height:190px}#wl .orb i{position:absolute;inset:0;border-radius:50%;border:2px dotted #e5251b;animation:spn 9s linear infinite}#wl .orb i+i{inset:28px;border-color:#f2f2ef66;animation-duration:6s;animation-direction:reverse}
#wl .orb b{position:absolute;inset:62px;border-radius:50%;background:#e5251b;box-shadow:0 0 60px #e5251b99;animation:beat 2.4s ease-in-out infinite}
@keyframes spn{to{transform:rotate(360deg)}}@keyframes beat{50%{transform:scale(1.18)}}
#wl h1{font:700 42px Doto,monospace;margin:0;direction:ltr;letter-spacing:2px}#wl h1 span{display:inline-block;opacity:0;animation:pp .6s forwards}
@keyframes pp{from{opacity:0;transform:translateY(20px) scale(.6)}to{opacity:1;transform:none}}
#wl p{color:#8a8a86;margin:0;max-width:300px;line-height:1.8;opacity:0;animation:pp .8s 1.4s forwards}#wl .fl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;opacity:0;animation:pp .8s 1.8s forwards}#wl .fl span{border:1px solid #333;border-radius:99px;padding:5px 12px;font-size:13px}#wl .go{opacity:0;animation:pp .8s 2.2s forwards}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K='mazakrty_v1',PEN=10,IMP=['عادي','مهم','مهم جدًا'];
let D={subs:[],sort:'pri',coins:0,owned:['classic'],theme:'classic',gpa:{c:'',t:'',m:4}},UI={view:'home',open:null,n:3};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.subs)D=Object.assign(D,x)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const dk=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>dk(new Date()),u=s=>{const[y,m,d]=s.split('-');return Date.UTC(y,m-1,d)};
const diff=(a,b)=>Math.round((u(b)-u(a))/864e5),addD=d=>new Date(u(d)+864e5).toISOString().slice(0,10);
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()},tm=t=>{const[h,m]=t.split(':');return +h*60+ +m};
const pf=p=>p%1?p.toFixed(1):p;
const lec=s=>[],bk=s=>lec(s).filter(l=>!l.s&&l.d<=today()).length,stars=s=>'★'.repeat(s.str||3)+'☆'.repeat(5-(s.str||3));
const stat=s=>{const T=s.ch.length,d=s.ch.filter(c=>c.d).length;return{T,d,p:T?Math.round(d/T*1000)/10:0}};
function evalMiss(){let c=0;D.subs.forEach(s=>{if(!s.time)return;const t=tm(s.time),td=today();for(let d=s.tfrom||s.since;d<=td;d=addD(d)){if(s.log[d])continue;if(d<td||nowM()>t){s.log[d]='miss';s.pts=Math.max(0,s.pts-PEN);c=1}}});if(c)save()}
function score(s){const{T,d}=stat(s),dl=s.exam?Math.max(.5,diff(today(),s.exam)):60;return s.exam&&diff(today(),s.exam)<0?-1:(1+s.imp*.5)*(1+(5-(s.str||3))*.15)*(((T-d)/(T||1))+(T?0:.5)+bk(s)*.2)*(10/dl)}
function plan(s){const{T,d}=stat(s),R=T-d;if(!T)return{t:'لسه ما حددتش عدد الشابترز. أول ما تعرفه ضيفهم تحت وأنا أحسبلك الخطة.'};if(!s.exam)return{t:'حدد ميعاد الامتحان وأنا أحسبلك الخطة.'};const dl=diff(today(),s.exam);
 if(dl<0)return{t:'الامتحان عدّى.'};if(!R)return{t:'خلّصت المنهج كله. راجع بس.'};if(dl===0)return{t:'امتحانك النهارده. راجع اللي فاضل وبالتوفيق.'};
 const rev=dl>=4?2:dl>=2?1:0,sd=Math.max(1,dl-rev),per=Math.ceil(R/sd),nx=s.ch.filter(c=>!c.d).slice(0,per).map(c=>c.t);
 const span=Math.max(1,diff(s.since,s.exam)-rev),exp=Math.min(T,Math.ceil(T*(diff(s.since,today())+1)/span)),dd=d-exp;
 return{t:`باقي ${R} شابتر على ${dl} يوم${rev?` (آخر ${rev} ${rev>1?'يومين':'يوم'} مراجعة)`:''}.`,per,nx,dd}}
function rowCard(s){const{T,d,p}=stat(s),dl=s.exam?diff(today(),s.exam):null,td=today(),lg=s.log[td];
 return`<div class="c" data-a="open" data-i="${s.id}"><div class="r1"><b>${esc(s.name)}</b><span class="tag i${s.imp}">${IMP[s.imp]}</span></div><div class="dim" style="font-size:12px">${stars(s)}</div><div class="bar"><i style="width:${p}%"></i></div>
 <div class="r2"><span class="dim">${T?`${d}/${T} شابتر · ${pf(p)}%`:'لسه معرفتش عدد الشابترز'}</span><span class="m ${dl!=null&&dl<=7&&dl>=0?'hot':''}">${dl==null?'':dl<0?'DONE':dl+' DAYS'}</span></div>
 ${s.time?`<div class="r3" style="margin-top:8px"><span class="dim">⏰ ${s.time} <span class="pts ${s.pts<60?'low':''}">PTS ${s.pts}</span></span>${lg==='ok'?'<span class="dim">✓ ذاكرت النهارده</span>':lg==='miss'?'<span class="dim" style="color:var(--red)">فاتك النهارده</span>':`<button class="ch" data-a="ci" data-i="${s.id}">ذاكرت ✓</button>`}</div>`:''}</div>`}
function home(){evalMiss();const S=D.subs;let T=0,Dn=0;S.forEach(s=>{const x=stat(s);T+=x.T;Dn+=x.d});const pr=T?Dn/T*100:0,td=today();
 const ex=S.filter(s=>s.exam&&diff(td,s.exam)>=0).sort((a,b)=>a.exam<b.exam?-1:1)[0];
 const nxt=S.filter(s=>s.time&&!s.log[td]&&tm(s.time)>nowM()).sort((a,b)=>tm(a.time)-tm(b.time))[0];
 const so={pri:(a,b)=>score(b)-score(a),exam:(a,b)=>(a.exam||'9')<(b.exam||'9')?-1:1,prog:(a,b)=>stat(a).p-stat(b).p}[D.sort];
 $('#app').innerHTML=`<div class="top"><div class="logo" data-a="wel">MY STUDYY<i>.</i></div><div class="row" style="margin:0"><button class="ch" data-a="snd">${D.snd===0?'🔇':'🔊'}</button><button class="ch on" data-a="shop">🪙 ${D.coins}</button><button class="ch" data-a="theme">☾</button></div></div>
 <div class="hero"><div class="big">${pf(Math.round(pr*10)/10)}%</div><div class="bar"><i style="width:${pr}%"></i></div><div class="dim">${Dn} من ${T} شابتر خلصت${ex?` · أقرب امتحان: ${esc(ex.name)} بعد ${diff(td,ex.exam)} يوم`:''}${nxt?` · الجاية: ${esc(nxt.name)} الساعة ${nxt.time}`:''}</div></div>
 <button class="go" data-a="study" style="margin:0 0 4px">ابدأ مذاكرة دلوقتي ▶</button><button class="go" data-a="spin" style="margin:0 0 4px;background:var(--fg);color:var(--bg)">🎡 تحدي عشوائي</button><div class="row">${[['pri','الأولوية'],['exam','الامتحان'],['prog','الأقل تقدمًا']].map(([k,t])=>`<button class="ch ${D.sort===k?'on':''}" data-a="sort" data-k="${k}">${t}</button>`).join('')}</div>
 ${S.slice().sort(so).map(rowCard).join('')}${gpaBox()}${rwBox()}<button class="fab" data-a="add">+ مادة</button>`}
function detail(s){const{T,d,p}=stat(s),pl=plan(s),td=today();const lg=s.log[td];
 const dots=[...Array(14)].map((_,i)=>{const k=dk(new Date(Date.now()-(13-i)*864e5));return`<i class="${s.log[k]==='miss'?'miss':s.log[k]==='ok'?'ok':''}"></i>`}).join('');
 $('#app').innerHTML=`<div class="top"><button class="ch" data-a="back">← رجوع</button><button class="ch red" data-a="del">احذف المادة</button></div>
 <div class="f"><label class="l">اسم المادة</label><input data-k="name" value="${esc(s.name)}"><div class="g2"><div><label class="l">الأهمية</label><select data-k="imp">${IMP.map((t,i)=>`<option value="${i}" ${s.imp===i?'selected':''}>${t}</option>`).join('')}</select></div><div><label class="l">ميعاد الامتحان</label><input type="date" data-k="exam" value="${s.exam||''}"></div></div></div>
 <div class="f"><label class="l">أنت قوي قد إيه في المادة دي؟</label><div class="row">${[1,2,3,4,5].map(n=>`<button class="ch ${(s.str||3)>=n?'on':''}" data-a="star" data-n="${n}">★</button>`).join('')}</div></div><button class="go" data-a="study" data-i="${s.id}" style="margin:0 0 4px">ذاكر المادة دي دلوقتي ▶</button><div class="hero"><div class="big">${pf(p)}%</div><div class="bar"><i style="width:${p}%"></i></div><div class="dim">${d} من ${T} شابتر</div></div>
 <div class="pl"><b>خطة المذاكرة</b>${pl.t}${pl.per?`<br>النهارده: ${pl.nx.map(esc).join('، ')} (${pl.per} شابتر)`:''}${pl.dd!=null?`<br><span style="color:${pl.dd<0?'var(--red)':'inherit'}">${pl.dd<0?'متأخر '+(-pl.dd)+' شابتر عن الخطة':pl.dd>0?'سابق الخطة بـ '+pl.dd+' شابتر':'ماشي بالظبط على الخطة'}</span>`:''}</div>
 <div class="f"><label class="l">وقت مذاكرة يومي ثابت (لو فاتك بتخسر ${PEN} نقط)</label><div class="row"><input type="time" data-k="time" value="${s.time||''}" style="width:auto">${s.time?'<button class="ch" data-a="notime">إلغاء</button>':''}</div>
 ${s.time?`<div class="row"><span class="pts ${s.pts<60?'low':''}" style="font-size:20px">PTS ${s.pts}</span>${lg==='ok'?'<span class="dim">✓ ذاكرت النهارده</span>':lg==='miss'?'<span class="dim" style="color:var(--red)">فاتك النهارده</span>':'<button class="ch on" data-a="ci" data-i="'+s.id+'">ذاكرت النهارده ✓</button>'}</div><div class="dots">${dots}</div><div class="dim">آخر 14 يوم</div>`:''}</div>
 <div class="f"><label class="l">الشابترز</label>${s.ch.map((c,j)=>`<div class="cr"><input type="checkbox" data-a="tg" data-j="${j}" ${c.d?'checked':''}><input class="nm ${c.d?'d':''}" data-k="cn" data-j="${j}" value="${esc(c.t)}"><button class="x" data-a="rm" data-j="${j}">×</button></div>${fileBox(c,j)}`).join('')}<button class="ch" data-a="addch" style="margin-top:8px">+ شابتر</button></div>`}
const form=(i,v={})=>`<div class="f" data-f="${i}"><label class="l">اسم المادة</label><input data-q="name" value="${esc(v.name||'')}" placeholder="مثلًا: فيزياء">
 <label class="l">الشابترز: اسم كل شابتر في سطر، أو رقم بس (مثلًا 8)</label><textarea data-q="ch" rows="3">${esc(v.ch||'')}</textarea><label class="l" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-q="unk" style="width:20px" ${v.unk?'checked':''}>لسه معرفش عدد الشابترز، هضيفهم بعدين</label>
 <div class="g2"><div><label class="l">خلّصت كام شابتر؟</label><input type="number" min="0" data-q="done" value="${v.done||0}"></div><div><label class="l">ميعاد الامتحان</label><input type="date" data-q="exam" value="${v.exam||''}"></div>
 <div><label class="l">الأهمية</label><select data-q="imp">${IMP.map((t,k)=>`<option value="${k}" ${+v.imp===k?'selected':''}>${t}</option>`).join('')}</select></div><div><label class="l">وقت يومي (اختياري)</label><input type="time" data-q="time" value="${v.time||''}"></div><div><label class="l">قوتك في المادة</label><select data-q="str">${[1,2,3,4,5].map(n=>`<option value="${n}" ${+(v.str||3)===n?'selected':''}>${'★'.repeat(n)}</option>`).join('')}</select></div></div></div>`;
const collect=()=>[...document.querySelectorAll('[data-f]')].map(f=>{const o={};f.querySelectorAll('[data-q]').forEach(x=>o[x.dataset.q]=x.type==='checkbox'?x.checked:x.value);return o});
function setup(vals){const first=!D.subs.length&&!UI.add;vals=vals||[];while(vals.length<UI.n)vals.push({});vals.length=UI.n;
 $('#app').innerHTML=`<div class="top"><div class="logo">MY STUDYY<i>.</i></div>${first?'':'<button class="ch" data-a="back">← رجوع</button>'}</div><p class="dim" style="font-size:15px">${first?'أهلًا بيك! رتّب موادك مرة واحدة وأنا هظبطلك الخطة والتقدم والأولويات، ومتقلقش.':'أضف مواد جديدة.'}</p>
 <div class="row"><span class="dim">كام مادة؟</span>${[1,2,3,4,5,6,7,8].map(n=>`<button class="ch ${UI.n===n?'on':''}" data-a="cnt" data-n="${n}">${n}</button>`).join('')}</div>${vals.map((v,i)=>form(i,v)).join('')}<button class="go" data-a="start">ابدأ</button>`}
function create(){const td=today();collect().forEach(v=>{if(!v.name.trim())return;let L=v.ch.split('\n').map(x=>x.trim()).filter(Boolean);if(L.length===1&&/^\d+$/.test(L[0]))L=[...Array(Math.min(+L[0],60))].map((_,i)=>'شابتر '+(i+1));
 const s={id:Date.now()+Math.random(),name:v.name.trim(),imp:+v.imp||0,str:+v.str||3,lec:[],exam:v.exam||'',ch:(v.unk?[]:L).map((t,i)=>({t,d:i<+v.done})),time:v.time||'',pts:100,log:{},since:td};if(s.time)s.tfrom=nowM()>tm(s.time)?addD(td):td;D.subs.push(s)});save();UI={view:'home',n:3}}
const cur=()=>D.subs.find(s=>s.id==UI.open);

 else if(s&&(a==='fu'||a==='fd')){const L=s.ch[+el.dataset.j].f,k=+el.dataset.k,t=a==='fu'?k-1:k+1;if(t>=0&&t<L.length){[L[k],L[t]]=[L[t],L[k]];save()}}
 else if(s&&a==='fx'){const L=s.ch[+el.dataset.j].f,[f]=L.splice(+el.dataset.k,1);idbOp('delete',f.id);save()}
 else if(a==='shop'){UI={view:'shop'}}
 else if(a==='buy'){buy(el.dataset.k)}
 else if(a==='study'){openStudy(el.dataset.i)}
 else if(a==='fm'){if(!T0.run){T0.dur=T0.rem=+el.dataset.m*60;ftDraw();[...$('#fp').children].forEach(c=>c.classList.toggle('on',c===el))}}
 else if(a==='fg'){ftGo()}else if(a==='ff'){ftEnd()}else if(a==='fq'){ftClose()}
 else if(a==='star'&&s){s.str=+el.dataset.n;save()}
 else if(a==='lt'&&s){const l=s.lec[+el.dataset.j];l.s=el.checked;gain(l.s?5:-5,l.s?'+5 نقط، محاضرة اتذاكرت 📖':'');save()}
 else if(a==='rl'&&s){s.lec.splice(+el.dataset.j,1);save()}
 else if(a==='addlec'&&s){const d=$('#ld').value,t=$('#lt').value.trim();if(!d||!t){toast('اكتب التاريخ واسم المحاضرة');return}(s.lec=s.lec||[]).push({d,t,s:false});save()}
 else if(a==='add'){UI={view:'setup',n:1,add:1}}
 else if(a==='cnt'){UI.vals=collect();UI.n=+el.dataset.n}
 else if(a==='start'){const ok=collect().some(v=>v.name.trim());if(!ok)return;create()}
 else if(s&&a==='tg'){const c=s.ch[+el.dataset.j];c.d=el.checked;if(c.d){const n=todayCount()+1,b=n>1?Math.min(30,10*(n-1)):0;c.aw=10+b;c.dt=today();gain(c.aw,b?`+${c.aw} نقطة! 🔥 بونص عشان خلصت ${n} شابترز النهارده`:'+10 نقط، شابتر جديد خلص 👏')}else{gain(-(c.aw||0));c.aw=0;c.dt=''}save()}
 else if(s&&a==='rm'){(s.ch[+el.dataset.j].f||[]).forEach(f=>idbOp('delete',f.id));s.ch.splice(+el.dataset.j,1);save()}
 else if(s&&a==='addch'){s.ch.push({t:'شابتر '+(s.ch.length+1),d:false});save()}
 else if(s&&a==='notime'){s.time='';save()}
 else if(s&&a==='del'){s.ch.forEach(c=>(c.f||[]).forEach(f=>idbOp('delete',f.id)));D.subs=D.subs.filter(x=>x!==s);UI.open=null;save();if(!D.subs.length)UI={view:'setup',n:3}}
 draw()});
document.addEventListener('change',e=>{if(e.target.dataset.pj!=null){upPdf(+e.target.dataset.pj,e.target.files);return}const g=e.target.dataset.g,r=e.target.dataset.r;if(r){(D.rw=D.rw||{a:'',b:'',f:0})[r]=e.target.type==='checkbox'?(e.target.checked?1:0):e.target.value;save();draw();return}if(g){D.gpa[g]=e.target.value;save();draw();return}const k=e.target.dataset.k,s=UI.open&&cur();if(!k||!s)return;const v=e.target.value;
 if(k==='name'&&v.trim())s.name=v.trim();else if(k==='imp')s.imp=+v;else if(k==='exam')s.exam=v;else if(k==='cn')s.ch[+e.target.dataset.j].t=v||'شابتر';
 else if(k==='time'){s.time=v;if(v)s.tfrom=nowM()>tm(v)?addD(today()):today()}save();draw()});
if(!D.subs.length)UI={view:'setup',n:3};
applyTheme();draw();welcome();setInterval(()=>{if(UI.view==='home'&&!UI.open&&!document.activeElement.closest('input'))home()},60000);
</script>
